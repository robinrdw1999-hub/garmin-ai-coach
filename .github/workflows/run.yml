name: Dagelijkse Garmin AI Coach

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  run-coach:
    runs-on: ubuntu-latest
    steps:
    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Hulpprogrammas installeren
      run: pip install garminconnect google-genai

    - name: Script live opbouwen (Bypass Git)
      run: |
        cat << 'EOF' > coach.py
        import os
        import json
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        from garminconnect import Garmin
        from google import genai

        GARMIN_EMAIL = os.environ.get("GARMIN_EMAIL")
        GARMIN_WACHTWOORD = os.environ.get("GARMIN_WACHTWOORD")
        GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
        GMAIL_ADRES = os.environ.get("GMAIL_ADRES")
        GMAIL_APP_WACHTWOORD = os.environ.get("GMAIL_APP_WACHTWOORD")
        EMAIL_ONTVANGER = os.environ.get("EMAIL_ONTVANGER")

        try:
            print("Inloggen bij Garmin...")
            garmin = Garmin(GARMIN_EMAIL, GARMIN_WACHTWOORD)
            garmin.login()
            
            print("Data ophalen...")
            activiteiten = garmin.get_activities(0, 1)
            if not activiteiten:
                print("Geen activiteiten gevonden.")
                exit(0)
            
            activiteit_data = blackberries = activiteiten[0]
            relevante_data = {
                "Naam": activiteit_data.get("activityName"),
                "Type": activiteit_data.get("activityType", {}).get("typeKey"),
                "Datum": activiteit_data.get("startTimeLocal"),
                "Afstand (m)": activiteit_data.get("distance"),
                "Duur (sec)": activiteit_data.get("duration"),
                "Gemiddelde Hartslag": activiteit_data.get("averageHR"),
                "Maximale Hartslag": activiteit_data.get("maxHR"),
                "Calorieën": activiteit_data.get("calories"),
                "Gemiddelde Snelheid": activiteit_data.get("averageSpeed"),
                "Aerobe Training Stress": activiteit_data.get("aerobicTrainingEffect")
            }

            print("Diepgaande analyse opvragen bij Gemini...")
            client = genai.Client(api_key=GEMINI_API_KEY)
            
            # DE NIEUWE UITGEBREIDE PROMPT:
            prompt = (
                "Je bent een hoogwaardige, data-gedreven hardloopcoach en sportwetenschapper. "
                "Analyseer de onderstaande hardloopdata extreem grondig, kritisch en uitgebreid. Avoid clichés zoals 'Lekker bezig!' "
                "en focus puur op fysiologische inzichten, de relatie tussen snelheid en hartslag, en trainingsprogressie.\n\n"
                "Structureer de e-mail met duidelijke, professionele secties (gebruik hoofdletters en witregels voor leesbaarheid):\n\n"
                "1. KERNSTATISTIEKEN & DIANOSE\n"
                "Bereken de exacte snelheid in minuten per kilometer (min/km) op basis van de meters en seconden. "
                "Geef een fysiologische diagnose van deze specifieke training (bv. was het een herstelloop, drempeltraining, of VO2-max belasting?).\n\n"
                "2. INTENSITEIT & HARTSLAGANALYSE\n"
                "Analyseer de verhouding tussen de gemiddelde en maximale hartslag en de geleverde snelheid. "
                "Wat zegt dit over de cardiovasculaire efficiëntie van de loper tijdens deze sessie? Wat vertelt de Aerobe Training Stress score ons?\n\n"
                "3. ENERGIEVERBRUIK & METABOLISCH HERSTELADVIES\n"
                "Kijk naar de verbrande calorieën en de intensiteit. Geef concreet, wetenschappelijk onderbouwd advies over de nodige hydratie, "
                "koolhydraat/eiwitinname en de geschatte actieve hersteltijd voordat er weer intensief getraind kan worden.\n\n"
                "4. STRATEGISCHTRAININGSADVIES VOOR DE VOLGENDE SESSIE\n"
                "Geef op basis van deze specifieke data één heel concreet doel of type training mee voor de volgende keer om stagnatie te voorkomen "
                "en de aerobe basis/snelheid verder uit te bouwen.\n\n"
                f"Hier is de ruwe data van Garmin: {json.dumps(relevante_data)}"
            )

            response = client.models.generate_content(model='gemini-2.5-flash', contents=prompt)
            analyse_tekst = response.text

            print("Mail opstellen...")
            msg = MIMEMultipart()
            msg['From'] = GMAIL_ADRES
            msg['To'] = EMAIL_ONTVANGER
            msg['Subject'] = f"📊 Uitgebreide AI Coach Analyse: {activiteit_data.get('activityName', 'Training')}"
            msg.attach(MIMEText(analyse_tekst, 'plain'))

            print("Verzenden via Gmail...")
            server = smtplib.SMTP('smtp.gmail.com', 587)
            server.starttls()
            server.login(GMAIL_ADRES, GMAIL_APP_WACHTWOORD)
            server.sendmail(GMAIL_ADRES, EMAIL_ONTVANGER, msg.as_string())
            server.quit()
            
            print("Succes! Uitgebreide mail is onderweg.")

        except Exception as e:
            print(f"Fout tijdens run: {e}")
            exit(1)
        EOF

    - name: Script uitvoeren
      env:
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_WACHTWOORD: ${{ secrets.GARMIN_WACHTWOORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
        GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
        EMAIL_ONTVANGER: ${{ secrets.EMAIL_ONTVANGER }}
      run: python coach.py
