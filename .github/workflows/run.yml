name: Dagelijkse Garmin AI Coach

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'Welke analyse wil je nu direct ontvangen?'
        type: choice
        required: true
        default: 'resterende_dagen'
        options:
          - 'resterende_dagen'
          - 'koers_kansen_checker'

jobs:
  run-coach:
    runs-on: ubuntu-latest
    steps:
    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Garmin Token & Activity Cache laden
      uses: actions/cache@v4
      with:
        path: ~/.garminconnect
        key: garmin-tokens-${{ github.run_id }}
        restore-keys: |
          garmin-tokens-

    - name: Hulpprogrammas installeren
      run: pip install garminconnect google-genai

    - name: Script live opbouwen (Unified AI Core met Slimme Datum)
      run: |
        cat << 'EOF' > coach.py
        import os
        import json
        import time
        import smtplib
        from datetime import datetime, timedelta
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        from garminconnect import Garmin
        from google import genai

        GARMIN_EMAIL = os.environ.get("GARMIN_EMAIL")
        GARMIN_WACHTWOORD = os.environ.get("GARMIN_WACHTWOORD")
        GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
        GMAIL_ADRES = os.environ.get("GMAIL_ADRES")
        GMAIL_APP_WACHTWOORD = os.environ.get("GMAIL_APP_WACHTWOORD")
        EMAIL_ONTVANGER = os.environ.get("EMAIL_ONTVANGER")
        
        EVENT_NAME = os.environ.get("GITHUB_EVENT_NAME")
        GEKOZEN_INPUT = os.environ.get("CHOSEN_MODUS")
        
        if EVENT_NAME == "schedule":
            MODUS = "auto_coach"
        else:
            MODUS = GEKOZEN_INPUT

        try:
            print(f"Inloggen bij Garmin voor modus: {MODUS}...")
            token_dir = os.path.expanduser("~/.garminconnect")
            os.makedirs(token_dir, exist_ok=True)
            
            garmin = Garmin(GARMIN_EMAIL, GARMIN_WACHTWOORD)
            garmin.login(token_dir)
            
            print("Wieleractiviteiten ophalen...")
            alle_activiteiten = garmin.get_activities(0, 10)
            if not alle_activiteiten:
                print("Geen activiteiten gevonden.")
                exit(0)
            
            nieuwste_act = alle_activiteiten[0]
            nieuwste_id = nieuwste_act.get("activityId")
            start_time_str = nieuwste_act.get("startTimeLocal") # Formaat: YYYY-MM-DD HH:MM:SS
            
            nu_be = datetime.utcnow() + timedelta(hours=2)
            
            if MODUS == "auto_coach":
                last_id_file = os.path.join(token_dir, "last_activity_id.txt")
                if os.path.exists(last_id_file):
                    with open(last_id_file, "r") as f:
                        if str(f.read().strip()) == str(nieuwste_id):
                            print("Activiteit al behandeld. We stoppen.")
                            exit(0)
                
                act_time = datetime.strptime(start_time_str, "%Y-%m-%d %H:%M:%S")
                if nu_be - act_time > timedelta(minutes=90):
                    print("Geen gloednieuwe activiteit gedetecteerd.")
                    exit(0)

            geschiedenis = []
            for act in alle_activiteiten:
                geschiedenis.append({
                    "Naam": act.get("activityName"),
                    "Type": act.get("activityType", {}).get("typeKey"),
                    "Datum": act.get("startTimeLocal"),
                    "Afstand (m)": act.get("distance"),
                    "Duur (sec)": act.get("duration"),
                    "Gemiddelde Hartslag": act.get("averageHR"),
                    "Maximale Hartslag": act.get("maxHR"),
                    "Calorieën": act.get("calories"),
                    "Aerobe Training Stress": act.get("aerobicTrainingEffect"),
                    "Anaerobe Training Stress": act.get("anaerobicTrainingEffect")
                })

            # --- DYNAMISCHE DATUMBEREKENING ---
            dagen = ["maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag", "zondag"]
            maanden = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"]
            vandaag_voluit = f"{dagen[nu_be.weekday()]} {nu_be.day} {maanden[nu_be.month - 1]} {nu_be.year}"
            
            # Controleer of de meest recente rit écht van vandaag is
            rit_datum_str = start_time_str.split(" ")[0] # Geeft YYYY-MM-DD
            vandaag_str = nu_be.strftime("%Y-%m-%d")
            
            if rit_datum_str == vandaag_str:
                training_status = f"De renner heeft VANDAAG ({vandaag_voluit}) al getraind. De meest recente rit in de data is van vandaag."
            else:
                training_status = f"De renner heeft vandaag ({vandaag_voluit}) nog NIET getraind. De meest recente rit in de meegestuurde data is van GISTEREN of eerder ({start_time_str})."

            client = genai.Client(api_key=GEMINI_API_KEY)

            if MODUS in ["auto_coach", "resterende_dagen"]:
                subject = f"🚴‍♂️ MAP: Plan resterende dagen vanaf morgen — {nieuwste_act.get('activityName', 'Wielertraining')}"
                prompt = (
                    f"Je bent een elite wielercoach. De renner heeft op vrijdag 12 juni 2026 de 'N8cht van de Kar' (avondcriterium).\n"
                    f"BELANGRIJKE TIMING: Vandaag is exact {vandaag_voluit}.\n"
                    f"TRAININGSTATUS VAN VANDAAG: {training_status}\n\n"
                    "STRIKTE RICHTLIJN VOOR HET SCHEMA:\n"
                    "- Pas je advies aan op de trainingsstatus. Als de renner vandaag nog NIET getraind heeft, mag je voor vandaag nog een korte prikkel of herstelrit inplannen.\n"
                    "- Genereer uitsluitend een concreet trainingsvoorstel voor de RESTERENDE dagen van deze week (tot en met zondag).\n"
                    "- DOORDESWEEKSE RESTERENDE DAGEN moeten KORT zijn (< 75-90 minuten) met specifieke criteriumprikkels of actieve herstelritten.\n\n"
                    "Structureer de e-mail exact met de volgende onderdelen in HOOFDLETTERS:\n\n"
                    "OPENINGSQUOTE\n\n1. ANATOMIE VAN DE LAATSTE RIT\n\n2. HET RESTERENDE WEEKPLAN (VANAF MORGEN OF VANAVOND)\n\n3. NEUROMUSCULAIR VS. METABOOL HERSTEL\n\n4. CARBON-LOADING & SUPERCOMPENSATIE (72 KG SPECIFIEK)\n\n5. TACTISCH RECEPT VOOR DE N8CHT VAN DE KAR\n\n"
                    f"Data: {json.dumps(geschiedenis)}"
                )

            else:
                subject = f"📊 CRITERIUM ANALYSE: Jouw realistische kansen voor N8cht van de Kar"
                prompt = (
                    f"Vandaag is exact {vandaag_voluit}. De renner (1m80, 72 kg) rijdt over exact een aantal dagen (vrijdag 12 juni 2026) "
                    "de 'N8cht van de Kar', een slopend, technisch avondcriterium / kermiskoer in Vlaanderen.\n\n"
                    "Je bent een deskundige, nuchtere Belgische ploegleider en wieleranalist. "
                    "Analyseer de data van de afgelopen 10 ritten grondig. "
                    "STRIKTE INSTRUCTIE: De opgebouwde vermoeidheid en fysiologische belasting in de data zijn GEPLANDE COMPENSATIE-ARBEID, GEEN CHRONISCHE OVERTRAINING! "
                    "Concludeer dus NOOIT dat de renner overtraind is. Adviseer ook NOOIT om tot vrijdag volledig stil te zitten. De renner moet juist kort en scherp taperen.\n\n"
                    "Evalueer de verhouding tussen aerobe basis en anaerobe capaciteit. "
                    "Geef een constructief, modern taper-advies: drastisch minder volume (duur), maar met behoud van korte, felle "
                    "neuromusculaire prikkels om de spanning op de spieren te houden.\n\n"
                    "Schrijf een vlijmscherpe, objectieve en realistische rapportage in de ik-vorm als ploegleider. "
                    "Structureer de e-mail exact met de volgende hoofdtitels in HOOFDLETTERS:\n\n"
                    "DE RAUWE DIAGNOSE (HET RENNERSPROFIEL)\n\n"
                    "DE TAPER-BALANS (DE FRISHEIDSMETER)\n\n"
                    "REALISTISCH KOERSSCENARIO & KANSBEREKENING\n"
                    "Geef een procentuele kans op (en wees fysiologisch realistisch):\n"
                    "- % Kans op active koers (meeschuiven/aanvallen)\n"
                    "- % Kans op anoniem uitrijden in het peloton\n"
                    "- % Kans op vroege deconnexie\n\n"
                    "HET TACTISCHE GEVECHTSPLAN (Geef 3 concrete, strategische opdrachten voor deze week en de koers zelf)\n\n"
                    f"Data: {json.dumps(geschiedenis)}"
                )

            print("Analyse aanvragen bij Gemini...")
            response = None
            max_pogingen = 5
            wachttijd = 10
            
            for poging in range(max_pogingen):
                try:
                    response = client.models.generate_content(model='gemini-2.5-flash', contents=prompt)
                    break
                except Exception as api_e:
                    if poging < max_pogingen - 1:
                        print(f"Gemini server overbelast (503). Poging {poging + 1} mislukt. Slaap {wachttijd}s...")
                        time.sleep(wachttijd)
                        wachttijd *= 2
                    else:
                        raise api_e

            print("Mail verzenden...")
            msg = MIMEMultipart()
            msg['From'] = GMAIL_ADRES
            msg['To'] = EMAIL_ONTVANGER
            msg['Subject'] = subject
            msg.attach(MIMEText(response.text, 'plain'))

            server = smtplib.SMTP('smtp.gmail.com', 587)
            server.starttls()
            server.login(GMAIL_ADRES, GMAIL_APP_WACHTWOORD)
            server.sendmail(GMAIL_ADRES, EMAIL_ONTVANGER, msg.as_string())
            server.quit()

            if MODUS == "auto_coach":
                with open(last_id_file, "w") as f:
                    f.write(str(nieuwste_id))
            
            print("Succesvol afgerond!")

        except Exception as e:
            print(f"Fout: {e}")
            exit(1)
        EOF

    - name: Script Uitvoeren
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        CHOSEN_MODUS: ${{ github.event.inputs.modus }}
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_WACHTWOORD: ${{ secrets.GARMIN_WACHTWOORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
        GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
        EMAIL_ONTVANGER: ${{ secrets.EMAIL_ONTVANGER }}
      run: python coach.py
