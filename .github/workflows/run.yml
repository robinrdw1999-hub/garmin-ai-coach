name: Dagelijkse Garmin AI Wielercoach

on:
  schedule:
    # GitHub cron draait in UTC.
    # 04:30 UTC is 06:30 in Belgische zomertijd.
    - cron: '30 4 * * *'

  workflow_dispatch:
    inputs*
      modus:
        description:*'Analyse type'
        required: t*ue
        default: 'dagadvies'
  *     type: choice
        options:*          - dagadvies
          - *eek_schema
          - workout_fee*back
          - race_readiness
  *       - herstel_check

      feed*ack:
        description: 'Subject*eve feedback: vermoeidheid, pijn, *enen, motivatie, slaapgevoel'
    *   required: false
        default* 'Geen actuele subjectieve feedbac* opgegeven.'
        type: string
*      extra_context:
        descr*ption: 'Extra context, bv. weinig *ijd, materiaal, avondwedstrijd, re*sdag'
        required: false
    *   default: ''
        type: strin*

jobs:
  run-coach:
    runs-on: *buntu-latest

    steps:
      - u*es: actions/checkout@v4

      - u*es: actions/setup-python@v5
      * with:
          python-version: '*.11'

      - name: Cache Garmin t*kens
        uses: actions/cache@v*
        with:
          path: ~/.*arminconnect
          key: garmin*tokens-v2-${{ runner.os }}
       *  restore-keys: |
            garm*n-tokens-v2-

      - name: Instal*eer dependencies
        run: pip *nstall garminconnect google-genai *roq

      - name: Run Coach
     *  env:
          GITHUB_EVENT_NAME* ${{ github.event_name }}
        * CHOSEN_MODUS: ${{ github.event.in*uts.modus }}
          USER_FEEDBA*K: ${{ github.event.inputs.feedbac* }}
          EXTRA_CONTEXT: ${{ g*thub.event.inputs.extra_context }}*
          GARMIN_EMAIL: ${{ secre*s.GARMIN_EMAIL }}
          GARMIN*WACHTWOORD: ${{ secrets.GARMIN_WAC*TWOORD }}

          GEMINI_API_KE*: ${{ secrets.GEMINI_API_KEY }}
  *       GROQ_API_KEY: ${{ secrets.G*OQ_API_KEY }}

          GMAIL_ADR*S: ${{ secrets.GMAIL_ADRES }}
    *     GMAIL_APP_WACHTWOORD: ${{ sec*ets.GMAIL_APP_WACHTWOORD }}
      *   EMAIL_ONTVANGER: ${{ secrets.EM*IL_ONTVANGER }}
        run: pytho* coach.py
