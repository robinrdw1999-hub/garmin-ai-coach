name: Dagelijkse Garmin AI Coach

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 * * * *' # Controleert elk uur automatisch op de achtergrond
  workflow_dispatch: {}

jobs:
  run-coach:
    runs-on: ubuntu-latest
    steps:
    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Hulpprogrammas installeren
      run: pip install garminconnect google-genai

    - name: Script live opbouwen (Validated Quotes Update)
      run: |
        cat << 'EOF' > coach.py
        import os
        import json
        import smtplib
        from datetime import datetime, timedelta
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        from garminconnect import Garmin
        from google import genai

        GARMIN_EMAIL = os.environ.get("GARMIN_EMAIL")
        GARMIN_WACHTWOORD = os.environ.get("GARMIN_WACHTWOORD")
        GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
        GMAIL_ADRES = os.environ.get("GMAIL_ADRES")
        GMAIL_APP_WACHTWOORD = os.environ.get("GMAIL_APP_WACHTWOORD")
        EMAIL_ONTVANGER = os.environ.get("EMAIL_ONTVANGER")

        try:
            print("Inloggen bij Garmin...")
            garmin = Garmin(GARMIN_EMAIL, GARMIN_WACHTWOORD)
            garmin.login()
            
            print("Laatste 7 activiteiten ophalen...")
            alle_activiteiten = garmin.get_activities(0, 7)
            if not alle_activiteiten:
                print("Geen activiteiten gevonden.")
                exit(0)
            
            # Pak de allernieuwste loop voor de real-time controle
            nieuwste_act = alle_activiteiten[0]
            start_time_str = nieuwste_act.get("startTimeLocal")
            
            is_manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" or os.environ.get("GITHUB_EVENT_NAME") == "push"
            
            if not is_manual:
                act_time = datetime.strptime(start_time_str, "%Y-%m-%d %H:%M:%S")
                huidige_tijd_be = datetime.utcnow() + timedelta(hours=2) # UTC+2 (Nederlandse tijd)
                tijdsverschil = huidige_tijd_be - act_time
                
                if tijdsverschil > timedelta(minutes=90):
                    print(f"Laatste activiteit is van {start_time_str}. Langer dan 90 min geleden. Geen actie nodig.")
                    exit(0)
            
            print("Nieuwe activiteit gedetecteerd! Trendlijst opbouwen...")
            geschiedenis = []
            for act in alle_activiteiten:
                geschiedenis.append({
                    "Naam": act.get("activityName"),
                    "Type": act.get("activityType", {}).get("typeKey"),
                    "Datum": act.get("startTimeLocal"),
                    "Afstand (m)": act.get("distance"),
                    "Duur (sec)": act.get("duration"),
                    "Gemiddelde Hartslag": act.get("averageHR"),
                    "Maximale Hartslag": act.get("maxHR"),
                    "Calorieën": act.get("calories"),
                    "Aerobe Training Stress": act.get("aerobicTrainingEffect")
                })

            client = genai.Client(api_key=GEMINI_API_KEY)
            
            # DE PROMPT MET STRIKTE VALIDATIE OP QUOTES
            prompt = (
                "Je bent een elite sportwetenschapper en fysioloog. Je analyseert de hardloopgeschiedenis van een atleet "
                "met het volgende profiel: Lengte 1m80, Gewicht 72 kg (slanke, efficiënte loper, BMI 22.2).\n\n"
                "STRIKTE RICHTLIJN: Herhaal GEEN basisstatistieken die de atleet al direct in de Garmin Connect app kan zien. "
                "Focus uitsluitend op diepe, onzichtbare fysiologische inzichten en de cumulatieve trend van de afgelopen 10 dagen.\n\n"
                "Structureer de e-mail exact met de volgende specifieke onderdelen (gebruik HOOFDLETTERS voor de titels en witregels):\n\n"
                "OPENINGSQUOTE\n"
                "Begin de e-mail ALTIJD direct met een historisch correcte, feitelijk gevalideerde en écht bestaande sport- of hardloopquote "
                "(van een bekende atleet, coach of filosoof) die perfect aansluit bij de aard en intensiteit van de nieuwste training. "
                "Bedenk of verzin NOOIT zelf een quote en combineer geen losse uitspraken; gebruik uitsluitend 100% waargebeurde, gedocumenteerde "
                "citaten. Plaats de quote gecursiveerd met de exacte auteur eronder.\n\n"
                "1. DIAGNOSE RECENTE LOOP & HARTSLAGDRIFT\n"
                "Evalueer de allernieuwste training fysiologisch. Analyseer de relatie tussen gemiddelde/maximale hartslag en duur. "
                "Was er sprake van aerobic decoupling (hartslagdrift) tijdens de sessie en wat zegt dit over de cardiovasculaire efficiëntie van vandaag?\n\n"
                "2. ACUTE VS. CHRONISCHE BELASTING (10-DAGEN TREND)\n"
                "Kijk naar de gehele geschiedenis van de afgelopen 7 trainingen. Loopt de trainingsomvang te snel op of is er sprake van gezonde periodisering? "
                "Signaleer je patronen van cumulatieve vermoeidheid over de afgelopen dagen?\n\n"
                "3. CENTRAAL ZENUWSTELSEL VS. MECHANISCHE SCHADE\n"
                "Bepaal welk systeem de grootste klap heeft gehad: het Centrale Zenuwstelsel (neurologisch, door hoge hartslagzones) "
                "of het spierstelsel (mechanische impactschaal). Wat betekent dit voor de komende 48 uur?\n\n"
                "4. EXACT METABOOL HERSTELPLAN (72 KG SPECIFIEK)\n"
                "Bereken op basis van de calorieën en zijn gewicht van 72 kg de exacte nutritionele herstelbehoefte. "
                "Geef harde streefgetallen in GRAMMEN koolhydraten en GRAMMEN eiwitten binnen het 'golden window', "
                "inclusief de exacte vocht- en elektrolytenbehoefte in milliliters.\n\n"
                "5. STRATEGISCH TRAININGSRECEPT (BLINDE VLEKKEN)\n"
                "Geef één concreet, tactisch trainingsadvies voor de volgende sessie (duur, intensiteit, type training) om supercompensatie te triggeren.\n\n"
                f"Hier is de Garmin datahistorie: {json.dumps(geschiedenis)}"
            )

            response = client.models.generate_content(model='gemini-2.5-flash', contents=prompt)
            analyse_tekst = response.text

            print("Mail opstellen...")
            msg = MIMEMultipart()
            msg['From'] = GMAIL_ADRES
            msg['To'] = EMAIL_ONTVANGER
            msg['Subject'] = f"🔬 Elite Trend-Analyse: {nieuwste_act.get('activityName', 'Training')}"
            msg.attach(MIMEText(analyse_tekst, 'plain'))

            print("Verzenden via Gmail...")
            server = smtplib.SMTP('smtp.gmail.com', 587)
            server.starttls()
            server.login(GMAIL_ADRES, GMAIL_APP_WACHTWOORD)
            server.sendmail(GMAIL_ADRES, EMAIL_ONTVANGER, msg.as_string())
            server.quit()
            
            print("Succes! Mail met gevalideerde quote is verstuurd.")

        except Exception as e:
            print(f"Fout tijdens run: {e}")
            exit(1)
        EOF

    - name: Script uitvoeren
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_WACHTWOORD: ${{ secrets.GARMIN_WACHTWOORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
        GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
        EMAIL_ONTVANGER: ${{ secrets.EMAIL_ONTVANGER }}
      run: python coach.py
