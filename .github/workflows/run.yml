name: Dagelijkse Garmin AI Wielercoach

on:
  schedule:
    - cron: '30 4 * * *'

  workflow_dispatch:
    inputs:
      modus:
        description: 'Analyse type'
        required: true
        default: 'dagadvies'
        type: choice
        options:
          - dagadvies
          - week_schema
          - race_readiness
          - conditie_evolutie

      feedback:
        description: 'Subjectieve feedback: vermoeidheid, pijn, benen, motivatie, slaapgevoel'
        required: false
        default: 'Geen actuele subjectieve feedback opgegeven.'
        type: string

      extra_context:
        description: 'Extra context, bijvoorbeeld weinig tijd, materiaal, avondwedstrijd of reisdag'
        required: false
        default: ''
        type: string

      analyseperiode_dagen:
        description: 'Aantal dagen voor conditieanalyse'
        required: false
        default: '90'
        type: string

      powerdata:
        description: 'Powerdata beschikbaar? ja, nee of soms'
        required: false
        default: 'soms'
        type: string

      ftp:
        description: 'FTP in watt, of onbekend'
        required: false
        default: 'onbekend'
        type: string

      max_hr:
        description: 'Maximale hartslag, of onbekend'
        required: false
        default: 'onbekend'
        type: string

      rust_hr:
        description: 'Rusthartslag, of onbekend'
        required: false
        default: 'onbekend'
        type: string

      gewicht:
        description: 'Gewicht in kg'
        required: false
        default: '72'
        type: string

      focus_conditieanalyse:
        description: 'Focus van conditieanalyse'
        required: false
        default: 'wielervorm, koerspunch en herstel'
        type: string

jobs:
  run-coach:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Garmin tokens
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-v2-${{ runner.os }}
          restore-keys: |
            garmin-tokens-v2-

      - name: Installeer dependencies
        run: pip install garminconnect google-genai

      - name: Run Coach
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHOSEN_MODUS: ${{ github.event.inputs.modus }}
          USER_FEEDBACK: ${{ github.event.inputs.feedback }}
          EXTRA_CONTEXT: ${{ github.event.inputs.extra_context }}

          ANALYSEPERIODE_DAGEN: ${{ github.event.inputs.analyseperiode_dagen }}
          POWERDATA: ${{ github.event.inputs.powerdata }}
          FTP: ${{ github.event.inputs.ftp }}
          MAX_HR: ${{ github.event.inputs.max_hr }}
          RUST_HR: ${{ github.event.inputs.rust_hr }}
          GEWICHT: ${{ github.event.inputs.gewicht }}
          FOCUS_CONDITIEANALYSE: ${{ github.event.inputs.focus_conditieanalyse }}

          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_WACHTWOORD: ${{ secrets.GARMIN_WACHTWOORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
          GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
          EMAIL_ONTVANGER: ${{ secrets.EMAIL_ONTVANGER }}
        run: python coach.py
