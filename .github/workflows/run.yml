name: Dagelijkse Garmin AI Coach

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '18 * * * *'
  workflow_dispatch: {}

jobs:
  run-coach:
    runs-on: ubuntu-latest
    steps:
    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Garmin Token Cache laden
      uses: actions/cache@v4
      with:
        path: ~/.garminconnect
        key: garmin-tokens-${{ github.run_id }}
        restore-keys: |
          garmin-tokens-

    - name: Hulpprogrammas installeren
      run: pip install garminconnect google-genai

    - name: Script live opbouwen (Race Prep Mode)
      run: |
        cat << 'EOF' > coach.py
        import os
        import json
        import time
        import smtplib
        from datetime import datetime, timedelta
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        from garminconnect import Garmin
        from google import genai

        GARMIN_EMAIL = os.environ.get("GARMIN_EMAIL")
        GARMIN_WACHTWOORD = os.environ.get("GARMIN_WACHTWOORD")
        GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
        GMAIL_ADRES = os.environ.get("GMAIL_ADRES")
        GMAIL_APP_WACHTWOORD = os.environ.get("GMAIL_APP_WACHTWOORD")
        EMAIL_ONTVANGER = os.environ.get("EMAIL_ONTVANGER")

        try:
            print("Inloggen bij Garmin...")
            token_dir = os.path.expanduser("~/.garminconnect")
            os.makedirs(token_dir, exist_ok=True)
            
            garmin = Garmin(GARMIN_EMAIL, GARMIN_WACHTWOORD)
            garmin.login(token_dir)
            
            alle_activiteiten = garmin.get_activities(0, 10)
            if not alle_activiteiten:
                exit(0)
            
            nieuwste_act = alle_activiteiten[0]
            
            # Prompt voor de race-voorbereiding
            client = genai.Client(api_key=GEMINI_API_KEY)
            
            prompt = (
                "Je bent een elite sportwetenschapper. De atleet heeft op 12 juni 2026 de 'N8cht van de Kar'. "
                "Vandaag is 31 mei. Het doel is om in deze laatste 12 dagen optimaal te pieken voor de race.\n\n"
                "STRIKTE BEPERKINGEN:\n"
                "- Lange duurlopen (duur > 60 min) MOGEN ALLEEN in het weekend (zaterdag 6 juni & zondag 7 juni).\n"
                "- Weekdagen (ma-vr) moeten bestaan uit korte, intensieve intervaltrainingen, herstel of lichte onderhoudstraining.\n"
                "- Geen zware trainingen meer in de laatste 48 uur voor de race op 12 juni.\n\n"
                "Genereer een trainingsplan voor de komende 7 dagen tot de race. "
                "Structureer de e-mail met:\n\n"
                "1. RACE PREP STATUS: Analyse van de laatste activiteit in context van het race-doel.\n"
                "2. HET WEEKPLAN: Duidelijk overzicht per dag (ma-zo).\n"
                "3. METABOOL & HERSTEL ADVIES: Specifiek voor de race-piek.\n"
                "4. STRATEGISCH RACETIP: Hoe de N8cht van de Kar tactisch aan te pakken.\n\n"
                f"Datahistorie: {json.dumps(alle_activiteiten[:7])}"
            )

            # --- EXCLUSIEVE RETRY STRATEGIE ---
            model_naam = 'gemini-2.5-flash'
            response = None
            max_pogingen = 5
            wachttijd = 30
            
            for poging in range(max_pogingen):
                try:
                    response = client.models.generate_content(model=model_naam, contents=prompt)
                    break
                except Exception as e:
                    if poging < max_pogingen - 1:
                        time.sleep(wachttijd)
                        wachttijd = int(wachttijd * 1.5)
                    else:
                        raise e

            # Mail versturen
            msg = MIMEMultipart()
            msg['From'] = GMAIL_ADRES
            msg['To'] = EMAIL_ONTVANGER
            msg['Subject'] = f"🚀 RACE PREP: N8cht van de Kar (12 juni) - {nieuwste_act.get('activityName')}"
            msg.attach(MIMEText(response.text, 'plain'))

            server = smtplib.SMTP('smtp.gmail.com', 587)
            server.starttls()
            server.login(GMAIL_ADRES, GMAIL_APP_WACHTWOORD)
            server.sendmail(GMAIL_ADRES, EMAIL_ONTVANGER, msg.as_string())
            server.quit()

        except Exception as e:
            print(f"Fout: {e}")
            exit(1)
        EOF

    - name: Script uitvoeren
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_WACHTWOORD: ${{ secrets.GARMIN_WACHTWOORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
        GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
        EMAIL_ONTVANGER: ${{ secrets.EMAIL_ONTVANGER }}
      run: python coach.py
