name: Dagelijkse Garmin AI Coach

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'Welke analyse wil je nu direct ontvangen?'
        type: choice
        required: true
        default: 'resterende_dagen'
        options:
          - 'resterende_dagen'
          - 'koers_kansen_checker'

jobs:
  run-coach:
    runs-on: ubuntu-latest
    steps:
    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Garmin Token & Activity Cache laden
      uses: actions/cache@v4
      with:
        path: ~/.garminconnect
        key: garmin-tokens-${{ github.run_id }}
        restore-keys: |
          garmin-tokens-

    - name: Hulpprogrammas installeren
      run: pip install garminconnect google-genai

    - name: Script live opbouwen (Focus: Wijtschaete & Crit Repeatability)
      run: |
        cat << 'EOF' > coach.py
        import os
        import json
        import time
        import smtplib
        from datetime import datetime, timedelta
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        from garminconnect import Garmin
        from google import genai

        GARMIN_EMAIL = os.environ.get("GARMIN_EMAIL")
        GARMIN_WACHTWOORD = os.environ.get("GARMIN_WACHTWOORD")
        GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
        GMAIL_ADRES = os.environ.get("GMAIL_ADRES")
        GMAIL_APP_WACHTWOORD = os.environ.get("GMAIL_APP_WACHTWOORD")
        EMAIL_ONTVANGER = os.environ.get("EMAIL_ONTVANGER")
        
        EVENT_NAME = os.environ.get("GITHUB_EVENT_NAME")
        GEKOZEN_INPUT = os.environ.get("CHOSEN_MODUS")
        
        if EVENT_NAME == "schedule":
            MODUS = "auto_coach"
        else:
            MODUS = GEKOZEN_INPUT

        try:
            print(f"Inloggen bij Garmin...")
            token_dir = os.path.expanduser("~/.garminconnect")
            os.makedirs(token_dir, exist_ok=True)
            
            garmin = Garmin(GARMIN_EMAIL, GARMIN_WACHTWOORD)
            garmin.login(token_dir)
            
            alle_activiteiten = garmin.get_activities(0, 10)
            if not alle_activiteiten:
                print("Geen activiteiten gevonden.")
                exit(0)
            
            nieuwste_act = alle_activiteiten[0]
            nieuwste_id = nieuwste_act.get("activityId")
            start_time_str = nieuwste_act.get("startTimeLocal")
            
            nu_be = datetime.utcnow() + timedelta(hours=2)
            
            if MODUS == "auto_coach":
                last_id_file = os.path.join(token_dir, "last_activity_id.txt")
                if os.path.exists(last_id_file):
                    with open(last_id_file, "r") as f:
                        if str(f.read().strip()) == str(nieuwste_id):
                            print("Al behandeld.")
                            exit(0)
                
                act_time = datetime.strptime(start_time_str, "%Y-%m-%d %H:%M:%S")
                if nu_be - act_time > timedelta(minutes=90):
                    print("Geen nieuwe rit.")
                    exit(0)

            geschiedenis = []
            for act in alle_activiteiten:
                geschiedenis.append({
                    "Naam": act.get("activityName"),
                    "Type": act.get("activityType", {}).get("typeKey"),
                    "Datum": act.get("startTimeLocal"),
                    "Afstand (m)": act.get("distance"),
                    "Duur (sec)": act.get("duration"),
                    "Gemiddelde Hartslag": act.get("averageHR"),
                    "Maximale Hartslag": act.get("maxHR"),
                    "Aerobe Training Stress": act.get("aerobicTrainingEffect"),
                    "Anaerobe Training Stress": act.get("anaerobicTrainingEffect")
                })

            dagen = ["maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag", "zondag"]
            maanden = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"]
            vandaag_voluit = f"{dagen[nu_be.weekday()]} {nu_be.day} {maanden[nu_be.month - 1]} {nu_be.year}"

            client = genai.Client(api_key=GEMINI_API_KEY)

            if MODUS in ["auto_coach", "resterende_dagen"]:
                subject = f"🚀 WIJTSCHAETE PREP: Jouw Anaerobe Schema vanaf morgen"
                prompt = (
                    f"Je bent een elite wielercoach. De renner heeft op zaterdag 11 juli 2026 de 'Wijtschaete koers' (kermiskoer).\n"
                    f"DOELSTELLING: De renner heeft een sterke motor (FTP/aeroob), maar is vandaag na 16km uit koers gereden omdat hij "
                    "kraakte op de constante spurts/herlanceringen na de bochten (Repeated Sprint Ability / Anaerobe capaciteit tekort).\n"
                    f"TIMING: Vandaag is exact {vandaag_voluit}. De renner kan van woensdag 1 juli t/m zondag 5 juli HELEMAAL NIET TRAINEN wegens vakantie/verplichtingen.\n\n"
                    "STRIKTE RICHTLIJNEN VOOR JOUW TRAININGSVOORSTELLEN:\n"
                    "1. BLOCK 1 (Nu t/m 30 juni): Rammen op anaerobe herhaalbaarheid. Schrijf loeiharde kermiskoer-simulaties voor (bijv. Tabata's, 30/30s, 40/20s, of 15-seconden full gas herlanceringen met korte rust).\n"
                    "2. BLOCK 2 (1 juli t/m 5 juli): Schrijf GEEN trainingen voor. Vermeld dat dit een gedwongen de-load is voor supercompensatie.\n"
                    "3. BLOCK 3 (6 juli t/m 10 juli): Re-activatie. Korte ritten met een paar vlijmscherpe prikkels om de spiertonus terug te halen na de inactiviteit.\n\n"
                    "Structureer je mail ALTIJD met deze titels:\n"
                    "OPENINGSQUOTE (Motiverend maar nuchter)\n"
                    "1. DE DIAGNOSE VAN HET TEKORT (Waarom ging het vandaag mis?)\n"
                    "2. JOUW SPECIFIEKE TARGET WORKOUT VOOR MORGEN (Geef exacte wattages/zones of gevoelstermijnen voor de sprints)\n"
                    "3. DE ROUTE NAAR WIJTSCHAETE (Hoe we de juliblokkade tackelen)\n"
                    f"Data: {json.dumps(geschiedenis)}"
                )
            else:
                subject = f"📊 KANSEN CHECKER: Wijtschaete koers (11 juli)"
                prompt = (
                    f"Vandaag is exact {vandaag_voluit}. Analyseer de kansen van de renner (72kg) voor Wijtschaete op 11 juli.\n"
                    "Neem mee dat hij een goede basismotor heeft maar moeite heeft met herlanceringen na de bocht, én 5 dagen stilzit begin juli.\n"
                    "Geef een realistische procentuele kans op:\n"
                    "- % Kans op actieve koers\n- % Kans op pelotonfinish\n- % Kans op vroege deconnexie\n"
                    f"Data: {json.dumps(geschiedenis)}"
                )

            print("Analyse aanvragen...")
            response = None
            for poging in range(5):
                try:
                    response = client.models.generate_content(model='gemini-2.5-flash', contents=prompt)
                    break
                except Exception as api_e:
                    time.sleep(10 * (poging + 1))

            print("Mail verzenden...")
            msg = MIMEMultipart()
            msg['From'] = GMAIL_ADRES
            msg['To'] = EMAIL_ONTVANGER
            msg['Subject'] = subject
            msg.attach(MIMEText(response.text, 'plain'))

            server = smtplib.SMTP('smtp.gmail.com', 587)
            server.starttls()
            server.login(GMAIL_ADRES, GMAIL_APP_WACHTWOORD)
            server.sendmail(GMAIL_ADRES, EMAIL_ONTVANGER, msg.as_string())
            server.quit()
            
            print("Klaar!")

        except Exception as e:
            print(f"Fout: {e}")
            exit(1)
        EOF

    - name: Script Uitvoeren
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        CHOSEN_MODUS: ${{ github.event.inputs.modus }}
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_WACHTWOORD: ${{ secrets.GARMIN_WACHTWOORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
        GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
        EMAIL_ONTVANGER: ${{ secrets.EMAIL_ONTVANGER }}
      run: python coach.py
