name: Dagelijkse Garmin AI Coach

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '*/15 * * * *' # Controleert nu ELKE 15 MINUTEN automatisch
  workflow_dispatch: {}

jobs:
  run-coach:
    runs-on: ubuntu-latest
    steps:
    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Garmin Token & Activity Cache laden
      uses: actions/cache@v4
      with:
        path: ~/.garminconnect
        key: garmin-tokens-${{ github.run_id }}
        restore-keys: |
          garmin-tokens-

    - name: Hulpprogrammas installeren
      run: pip install garminconnect google-genai

    - name: Script live opbouwen (15-Min Check + Dynamic Remaining Days)
      run: |
        cat << 'EOF' > coach.py
        import os
        import json
        import time
        import smtplib
        from datetime import datetime, timedelta
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        from garminconnect import Garmin
        from google import genai

        GARMIN_EMAIL = os.environ.get("GARMIN_EMAIL")
        GARMIN_WACHTWOORD = os.environ.get("GARMIN_WACHTWOORD")
        GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
        GMAIL_ADRES = os.environ.get("GMAIL_ADRES")
        GMAIL_APP_WACHTWOORD = os.environ.get("GMAIL_APP_WACHTWOORD")
        EMAIL_ONTVANGER = os.environ.get("EMAIL_ONTVANGER")

        try:
            print("Inloggen bij Garmin...")
            token_dir = os.path.expanduser("~/.garminconnect")
            os.makedirs(token_dir, exist_ok=True)
            
            garmin = Garmin(GARMIN_EMAIL, GARMIN_WACHTWOORD)
            garmin.login(token_dir)
            
            print("Wieleractiviteiten ophalen...")
            alle_activiteiten = garmin.get_activities(0, 10)
            if not alle_activiteiten:
                print("Geen activiteiten gevonden.")
                exit(0)
            
            nieuwste_act = alle_activiteiten[0]
            nieuwste_id = nieuwste_act.get("activityId")
            start_time_str = nieuwste_act.get("startTimeLocal")
            
            is_manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" or os.environ.get("GITHUB_EVENT_NAME") == "push"
            
            # --- ANTI-SPAM CHECK (Voorkom dubbele mails elke 15 minuten) ---
            last_id_file = os.path.join(token_dir, "last_activity_id.txt")
            if os.path.exists(last_id_file) and not is_manual:
                with open(last_id_file, "r") as f:
                    saved_id = f.read().strip()
                if str(saved_id) == str(nieuwste_id):
                    print(f"Activiteit {nieuwste_id} is al eerder geanalyseerd. We stoppen om spam te voorkomen.")
                    exit(0)
            
            # --- TIJDSVENSTER CHECK VOOR AUTOMATISCHE RUNS ---
            if not is_manual:
                act_time = datetime.strptime(start_time_str, "%Y-%m-%d %H:%M:%S")
                huidige_tijd_be = datetime.utcnow() + timedelta(hours=2) # UTC+2 (Belgische tijd)
                tijdsverschil = huidige_tijd_be - act_time
                
                # Als de rit langer dan 90 minuten geleden is, negeren we hem bij de automatische 15-minuten check
                if tijdsverschil > timedelta(minutes=90):
                    print(f"Laatste activiteit is van {start_time_str}. Geen recente koersprikkel gedetecteerd.")
                    exit(0)
            
            print("Nieuwe onbehandelde activiteit gedetecteerd! Trend opbouwen...")
            geschiedenis = []
            for act in alle_activiteiten:
                geschiedenis.append({
                    "Naam": act.get("activityName"),
                    "Type": act.get("activityType", {}).get("typeKey"),
                    "Datum": act.get("startTimeLocal"),
                    "Afstand (m)": act.get("distance"),
                    "Duur (sec)": act.get("duration"),
                    "Gemiddelde Hartslag": act.get("averageHR"),
                    "Maximale Hartslag": act.get("maxHR"),
                    "Calorieën": act.get("calories"),
                    "Aerobe Training Stress": act.get("aerobicTrainingEffect"),
                    "Anaerobe Training Stress": act.get("anaerobicTrainingEffect")
                })

            # Live de datum van vandaag bepalen in het Nederlands voor de AI
            nu_be = datetime.utcnow() + timedelta(hours=2)
            dagen = ["maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag", "zondag"]
            maanden = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"]
            vandaag_voluit = f"{dagen[nu_be.weekday()]} {nu_be.day} {maanden[nu_be.month - 1]} {nu_be.year}"

            client = genai.Client(api_key=GEMINI_API_KEY)
            
            prompt = (
                f"Je bent een elite wielercoach. De renner heeft op vrijdag 12 juni 2026 de 'N8cht van de Kar' (avondcriterium).\n"
                f"BELANGRIJKE TIMING: Vandaag is exact {vandaag_voluit}. De renner heeft VANDAAG al getraind (zie de meest recente rit in de datahstory).\n\n"
                "STRIKTE RICHTLIJN VOOR HET SCHEMA:\n"
                "- Geef GEEN trainingsvoorstel voor vandaag, want die rit is al gedaan.\n"
                "- Genereer uitsluitend een concreet trainingsvoorstel voor de RESTERENDE dagen van deze week (vanaf morgen tot en met zondag).\n"
                "- LANGE DUURTRAININGEN (2.5 tot 4 uur in Zone 2) MOGEN UITSLUITEND in het weekend (zaterdag 6 juni en zondag 7 juni) worden ingepland.\n"
                "- DOORDESWEEKSE RESTERENDE DAGEN moeten KORT zijn (< 75-90 minuten) met specifieke criteriumprikkels (bijv. aanzetten na de bocht, VO2max-prikkels) of actieve herstelritten.\n\n"
                "Structureer de e-mail exact met de volgende specifieke wieleronderdelen (gebruik HOOFDLETTERS voor de titels):\n\n"
                "OPENINGSQUOTE\n"
                "Begin direct met een écht bestaande, historische wielerquote over koers of afzien. Cursief met auteur eronder.\n\n"
                "1. ANATOMIE VAN DE RIT VAN VANDAAG\n"
                "Analyseer kort de fysiologische impact en de vermoeidheid van de rit die de renner zojuist heeft afgerond.\n\n"
                "2. HET RESTERENDE WEEKPLAN (VANAF MORGEN)\n"
                "Geef een concreet dagschema voor de resterende dagen van deze week (tot en met zondag). Houd rekening met de weekend-only regel voor lange ritten.\n\n"
                "3. NEUROMUSCULAIR VS. METABOOL HERSTEL\n"
                "Bepaal op basis van de rit van vandaag welk systeem nu de prioriteit heeft (herlanceren van de fiets vs. glycogeenaanvulling).\n\n"
                "4. CARBON-LOADING & SUPERCOMPENSATIE (72 KG SPECIFIEK)\n"
                "Nutritionele richtlijnen in grammen koolhydraten voor de komende dagen op basis van de rit van vandaag.\n\n"
                "5. TACTISCH RECEPT VOOR DE N8CHT VAN DE KAR\n"
                "Eén diepgaand technisch advies over positie kiezen of rijden in het donker.\n\n"
                f"Hier is de Garmin wielerdata: {json.dumps(geschiedenis)}"
            )

            # --- EXCLUSIEVE RETRY STRATEGIE ---
            model_naam = 'gemini-2.5-flash'
            response = None
            max_pogingen = 5
            wachttijd = 30
            
            for poging in range(max_pogingen):
                try:
                    print(f"Koersanalyse opvragen bij {model_naam} (poging {poging + 1}/{max_pogingen})...")
                    response = client.models.generate_content(model=model_naam, contents=prompt)
                    print(f"Succesvol antwoord ontvangen van {model_naam}!")
                    break
                except Exception as e:
                    print(f"Gemini gaf een melding: {e}")
                    if poging < max_pogingen - 1:
                        time.sleep(wachttijd)
                        wachttijd = int(wachttijd * 1.5)
                    else:
                        raise e

            analyse_tekst = response.text

            print("Mail opstellen...")
            msg = MIMEMultipart()
            msg['From'] = GMAIL_ADRES
            msg['To'] = EMAIL_ONTVANGER
            msg['Subject'] = f"🚴‍♂️ UPDATED KOERS PREP: Plan vanaf morgen — {nieuwste_act.get('activityName', 'Wielertraining')}"
            msg.attach(MIMEText(analyse_tekst, 'plain'))

            print("Verzenden via Gmail...")
            server = smtplib.SMTP('smtp.gmail.com', 587)
            server.starttls()
            server.login(GMAIL_ADRES, GMAIL_APP_WACHTWOORD)
            server.sendmail(GMAIL_ADRES, EMAIL_ONTVANGER, msg.as_string())
            server.quit()
            
            # --- LOCK OPSLAAN (Zorgt dat deze activiteit niet nogmaals gemaild wordt) ---
            with open(last_id_file, "w") as f:
                f.write(str(nieuwste_id))
            print("Succes! Koersadvies verzonden en activiteit gelockt in cache.")

        except Exception as e:
            print(f"Fout tijdens run: {e}")
            exit(1)
        EOF

    - name: Script uitvoeren
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_WACHTWOORD: ${{ secrets.GARMIN_WACHTWOORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
        GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
        EMAIL_ONTVANGER: ${{ secrets.EMAIL_ONTVANGER }}
      run: python coach.py
