name: Dagelijkse Garmin AI Wielercoach

on:
  schedule:
    # GitHub cron draait in UTC.
    # 04:30 UTC is 06:30 in Belgische zomertijd.
    - cron: '30 4 * * *'

  workflow_dispatch:
    inputs:
      modus:
        description: 'Analyse type'
        required: true
        default: 'dagadvies'
        type: choice
        options:
          - dagadvies
          - week_schema
          - workout_feedback
          - race_readiness
          - herstel_check

      feedback:
        description: 'Subjectieve feedback: vermoeidheid, pijn, benen, motivatie, slaapgevoel'
        required: false
        default: 'Geen actuele subjectieve feedback opgegeven.'
        type: string

      extra_context:
        description: 'Extra context, bv. weinig tijd, materiaal, avondwedstrijd, reisdag'
        required: false
        default: ''
        type: string

jobs:
  run-coach:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Garmin tokens
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-v2-${{ runner.os }}
          restore-keys: |
            garmin-tokens-v2-

      - name: Installeer dependencies
        run: pip install garminconnect google-genai groq

      - name: Run Coach
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHOSEN_MODUS: ${{ github.event.inputs.modus }}
          USER_FEEDBACK: ${{ github.event.inputs.feedback }}
          EXTRA_CONTEXT: ${{ github.event.inputs.extra_context }}

          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_WACHTWOORD: ${{ secrets.GARMIN_WACHTWOORD }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
          GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
          EMAIL_ONTVANGER: ${{ secrets.EMAIL_ONTVANGER }}
        run: python coach.py
