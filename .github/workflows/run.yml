name: Dagelijkse Garmin AI Triatlon Coach

on:
  schedule:
    - cron: '0 6 * * *' # Draait nu automatisch elke ochtend om 06:00
  workflow_dispatch:
    inputs:
      modus:
        description: 'Analyse type'
        required: true
        default: 'week_schema'
        type: choice
        options: ['week_schema', 'triatlon_kansen_checker']
      feedback:
        description: 'Jouw feedback (hoe voel je je, specifieke pijntjes, workout feedback)'
        required: false
        default: 'Ik voel me fit en klaar voor de triatlonprikkels.'
        type: string
      weer:
        description: 'Weersvoorspelling voor de komende dagen'
        required: false
        default: 'Typisch Belgisch zomerweer, rond de 21-24 graden met kans op een bui.'
        type: string

jobs:
  run-coach:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Garmin tokens
      uses: actions/cache@v4
      with:
        path: ~/.garminconnect
        key: garmin-tokens-${{ github.run_id }}
        restore-keys: |
          garmin-tokens-

    - name: Installeer dependencies
      run: pip install garminconnect google-genai

    - name: Run Coach
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        CHOSEN_MODUS: ${{ github.event.inputs.modus }}
        USER_FEEDBACK: ${{ github.event.inputs.feedback }}
        WEATHER_FORECAST: ${{ github.event.inputs.weer }}
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_WACHTWOORD: ${{ secrets.GARMIN_WACHTWOORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
        GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
        EMAIL_ONTVANGER: ${{ secrets.EMAIL_ONTVANGER }}
      run: python coach.py
