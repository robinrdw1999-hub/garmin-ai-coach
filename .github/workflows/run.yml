name: Dagelijkse Garmin AI Coach

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'Analyse type'
        required: true
        default: 'resterende_dagen'
        type: choice
        options: ['resterende_dagen', 'koers_kansen_checker']
      feedback:
        description: 'Jouw feedback (bijv. "Ik voel me overtraind" of "Hartslagmeter defect")'
        required: false
        default: 'Geen extra opmerkingen.'
        type: string

jobs:
  run-coach:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Garmin tokens
      uses: actions/cache@v4
      with:
        path: ~/.garminconnect
        key: garmin-tokens-${{ github.run_id }}
        restore-keys: |
          garmin-tokens-

    - name: Installeer dependencies
      run: pip install garminconnect google-genai

    - name: Run Coach
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        CHOSEN_MODUS: ${{ github.event.inputs.modus }}
        USER_FEEDBACK: ${{ github.event.inputs.feedback }}
        GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
        GARMIN_WACHTWOORD: ${{ secrets.GARMIN_WACHTWOORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
        GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
        EMAIL_ONTVANGER: ${{ secrets.EMAIL_ONTVANGER }}
      run: python coach.py
